<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>emojis — Settings</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1c1c22;
    --surface: #26262e;
    --border: #3a3a45;
    --text: #ece9e2;
    --muted: #8e8c86;
    --accent: #d4a04f;
    --accent-soft: #3a3326;
    --ok: #5dcaa5;
    --err: #e07a6b;
  }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    user-select: none;
  }
  .wrap { padding: 26px 28px; display: flex; flex-direction: column; gap: 22px; height: 100%; }
  h1 { font-size: 18px; font-weight: 600; }
  h1 .sub { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 4px; }

  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }

  .recorder {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .recorder:hover { border-color: var(--accent); }
  .recorder.recording { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .combo { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 15px; }
  .combo kbd {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 9px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
  }
  .combo .plus { color: var(--muted); }
  .combo .hint { color: var(--muted); font-size: 13px; }

  .recorder .action { font-size: 12px; color: var(--accent); white-space: nowrap; }

  .status { font-size: 12px; min-height: 16px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .status.muted { color: var(--muted); }

  .footer-note { margin-top: auto; font-size: 11px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>
      Settings
      <span class="sub">Set the global shortcut that opens the picker.</span>
    </h1>

    <div class="field">
      <label>Picker shortcut</label>
      <div class="recorder" id="recorder" tabindex="0">
        <div class="combo" id="combo"></div>
        <span class="action" id="action">Click to change</span>
      </div>
      <p class="status muted" id="status" style="margin-top:10px;">&nbsp;</p>
    </div>

    <p class="footer-note">
      Tip: press a modifier (Ctrl, Alt, Shift or Win) and hold it — the recorder
      waits for you to add a letter or key. Press <kbd>Esc</kbd> while recording to cancel.
    </p>
  </div>
  <script src="settings.js"></script>
</body>
</html>
