<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>emojis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1c1c22;
    --surface: #26262e;
    --border: #3a3a45;
    --text: #ece9e2;
    --muted: #8e8c86;
    --accent: #d4a04f;
    --accent-soft: #3a3326;
    --copied: #5dcaa5;
  }

  html, body {
    height: 100%;
    background: transparent;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  .panel {
    height: 100vh;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }

  .search-bar .glyph {
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
  }

  #search {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 17px;
    font-family: inherit;
  }

  #search::placeholder { color: var(--muted); }

  .results {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
  }

  .results::-webkit-scrollbar { width: 8px; }
  .results::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 14px;
    border-radius: 9px;
    cursor: pointer;
  }

  .row.active {
    background: var(--accent-soft);
  }

  .row .kao {
    font-size: 16px;
    color: var(--text);
    min-width: 130px;
    white-space: nowrap;
  }

  .row .kw {
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .row.active .kw { color: var(--accent); }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 20px;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
  }

  .hints { display: flex; gap: 14px; }

  kbd {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    font-size: 11px;
    color: var(--muted);
  }

  .copied {
    color: var(--copied);
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .copied.show { opacity: 1; }
</style>
</head>
<body>
  <div class="panel">
    <div class="search-bar">
      <span class="glyph">⌕</span>
      <input id="search" type="text" placeholder="Search kaomoji…  (try 'shrug')" autocomplete="off" spellcheck="false">
    </div>
    <div class="results" id="results"></div>
    <div class="footer">
      <div class="hints">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> copy</span>
        <span><kbd>esc</kbd> close</span>
      </div>
      <span class="copied" id="copied">copied!</span>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
