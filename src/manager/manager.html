<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>emojis — Manage kaomoji</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1c1c22;
    --surface: #26262e;
    --surface-2: #2e2e38;
    --border: #3a3a45;
    --text: #ece9e2;
    --muted: #8e8c86;
    --accent: #d4a04f;
    --accent-soft: #3a3326;
    --ok: #5dcaa5;
    --err: #e07a6b;
  }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  body { display: flex; flex-direction: column; height: 100vh; user-select: none; }

  header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--border);
  }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 17px; font-weight: 600; }
  .count { font-size: 12px; color: var(--muted); }
  .path { font-size: 11px; color: var(--muted); margin-top: 4px; word-break: break-all; user-select: text; }

  .toolbar {
    display: flex; gap: 10px; align-items: center;
    padding: 12px 22px;
  }
  #filter {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    padding: 9px 12px;
    outline: none;
  }
  #filter::placeholder { color: var(--muted); }
  #filter:focus { border-color: var(--accent); }

  button {
    font-family: inherit;
    font-size: 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 9px 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    white-space: nowrap;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1c1c22; font-weight: 600; }
  button.primary:hover { filter: brightness(1.05); }
  button.primary:disabled { opacity: 0.5; cursor: default; filter: none; }

  .list-head, .row {
    display: grid;
    grid-template-columns: 200px 1fr 34px;
    gap: 10px;
    align-items: center;
  }
  .list-head {
    padding: 4px 22px 8px;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .list {
    flex: 1;
    overflow-y: auto;
    padding: 0 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .list::-webkit-scrollbar { width: 9px; }
  .list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .row input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    padding: 9px 11px;
    outline: none;
    width: 100%;
    user-select: text;
  }
  .row input:focus { border-color: var(--accent); background: var(--surface-2); }
  .row input.kao { font-size: 15px; }

  .del {
    width: 34px; height: 34px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 16px; line-height: 1;
  }
  .del:hover { border-color: var(--err); color: var(--err); }

  .empty { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 14px; }

  footer {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 22px;
    border-top: 1px solid var(--border);
  }
  .status { font-size: 12px; min-height: 16px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .status.dirty { color: var(--accent); }
  .status.muted { color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Manage kaomoji</h1>
      <span class="count" id="count"></span>
    </div>
    <div class="path" id="path"></div>
  </header>

  <div class="toolbar">
    <input id="filter" type="text" placeholder="Filter by kaomoji or keyword…" autocomplete="off" spellcheck="false">
    <button id="add">＋ Add kaomoji</button>
  </div>

  <div class="list-head">
    <span>Kaomoji</span>
    <span>Keywords (space-separated)</span>
    <span></span>
  </div>

  <div class="list" id="list"></div>

  <footer>
    <span class="status muted" id="status">&nbsp;</span>
    <button class="primary" id="save" disabled>Save changes</button>
  </footer>

  <script src="manager.js"></script>
</body>
</html>
